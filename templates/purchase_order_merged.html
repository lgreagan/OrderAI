<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .title}}{{.title}}{{else}}采购合并单 - OrderAI{{end}}</title>
    <style>
        :root { --line: #d8dee9; --muted: #6b7280; --brand: #5268d5; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            background: #f4f6fa;
            color: #1f2937;
            font: 13.5px/1.55 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }
        .toolbar {
            max-width: 1040px;
            margin: 0 auto 10px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn {
            border: 1px solid var(--line);
            background: #fff;
            color: #1f2937;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-mini { padding: 4px 10px; font-size: 12px; border-radius: 5px; }

        .sheet {
            max-width: 1040px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 22px 24px 18px;
        }

        h1 { font-size: 20px; margin: 0 0 6px; }
        h1 .no { color: var(--brand); margin-left: 6px; }
        .badge {
            display: inline-block; padding: 1px 8px; border-radius: 10px;
            font-size: 11.5px; background: #eef1fb; color: #3b4fd8; vertical-align: middle;
        }

        /* 顶部汇总条：所有单据合计，一眼看到这趟要买多少钱 */
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin: 12px 0 4px;
        }
        .summary .cell {
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 9px 12px;
            background: #fafbfe;
        }
        .summary .k { color: var(--muted); font-size: 12px; }
        .summary .v { font-size: 17px; font-weight: 700; }
        .summary .v .unit { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }

        .po-block { margin-top: 18px; }
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            color: var(--muted);
            font-size: 12.5px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 7px 0;
            margin-bottom: 10px;
        }
        .meta span b { color: #1f2937; font-weight: 600; }

        .list-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 14px 0 6px;
        }
        .list-head h3 { font-size: 13.5px; margin: 0; color: #374151; }
        .list-tools { display: flex; align-items: center; gap: 8px; }
        .hint { color: var(--muted); font-size: 12px; }
        .ccy { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 3px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; }
        thead th { background: #f1f4f9; font-weight: 600; text-align: left; font-size: 12.5px; }
        td.num, th.num { text-align: right; white-space: nowrap; }
        td.ctr, th.ctr { text-align: center; white-space: nowrap; }
        tr.total td { font-weight: 700; background: #fafbfe; }
        /* 系列/版本小计行：夹在合并行之间，颜色略深便于区分。 */
        tr.subtotal td { background: #f5f7fe; font-weight: 600; color: #3b4fd8; }
        .cell-name { font-weight: 600; }
        .empty { padding: 22px; text-align: center; color: var(--muted); }
        tr.row-hidden { display: none; }

        /* 勾选框列：屏幕上给「隐藏勾选」用，打印与干净视图下不出现。 */
        .pick-col { width: 34px; }
        .pick-col input { width: 15px; height: 15px; cursor: pointer; margin: 0; vertical-align: middle; }
        body.clean .pick-col,
        body.clean .list-tools { display: none; }

        .note { margin-top: 10px; color: var(--muted); font-size: 12px; }
        .foot {
            margin-top: 16px;
            padding-top: 8px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 11.5px;
            display: flex;
            justify-content: space-between;
        }

        @page { size: A4 portrait; margin: 12mm; }
        @media print {
            body { background: #fff; padding: 0; }
            .toolbar { display: none !important; }
            .pick-col { display: none !important; }
            .list-tools { display: none !important; }
            .sheet { border: 0; border-radius: 0; padding: 0; max-width: none; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }
            .po-block { page-break-inside: auto; }
            .summary { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button class="btn" id="cleanViewBtn" title="隐藏勾选框与行内按钮，截图更干净">隐藏勾选框</button>
        <button class="btn" id="backBtn">返回</button>
        <button class="btn btn-primary" id="printBtn">打印 / 保存为 PDF</button>
    </div>

    <div class="sheet" id="sheet">
        <div class="empty">正在加载…</div>
    </div>

<script>
    // 勾选的采购单 id，逗号分隔，由服务端注入。
    var RAW_IDS = '{{.ids}}';
    var PO_IDS = String(RAW_IDS || '').split(',')
        .map(function (v) { return parseInt(v, 10); })
        .filter(function (v) { return v > 0; });
    var SKUS = {};
    var ALL_POS = [];
    var MULTI_CURRENCY = false;

    // 合并清单自身的显隐与勾选状态。合并表每次刷新都会整块重建，
    // 状态必须存在这里才不会丢；键是 物品/规格 + 币种 的合并键。
    var hiddenMerge = { mergeProduct: {}, mergeMaterial: {} };
    var pickedMerge = { mergeProduct: {}, mergeMaterial: {} };

    function esc(value) {
        return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function qty(v) { return Number(v || 0).toFixed(3).replace(/\.?0+$/, ''); }
    function money(v) { return Number(v || 0).toFixed(2); }
    function getJSON(url) { return fetch(url).then(function (r) { return r.json(); }); }

    // 型号一般就是产品名的前缀，SKU 已删除时用它把颜色拆出来。
    function stripModel(name, model) {
        if (!model) return '';
        return String(name).indexOf(model) === 0 ? String(name).slice(model.length) : '';
    }

    // 组内产品中文名的公共前缀，作为系列的中文名：西瓜球6厘米草绿 / 西瓜球7厘米薄荷绿 → 西瓜球。
    // 只有一项时没有「共同」可言，返回空，小计行只显示系列本身。
    function seriesCN(names) {
        names = (names || []).filter(function (n) { return !!n; });
        if (names.length < 2) return '';
        var prefix = names[0];
        names.forEach(function (n) {
            var i = 0;
            while (i < prefix.length && i < n.length && prefix.charAt(i) === n.charAt(i)) i++;
            prefix = prefix.slice(0, i);
        });
        var cut = prefix.search(/[0-9０-９\s]/);
        if (cut >= 0) prefix = prefix.slice(0, cut);
        return prefix;
    }

    // 系列/版本排序：V1、V2…这类版本号排最前（按数字大小），其余系列按字母序，空值固定排最后。
    function seriesCompare(a, b) {
        a = a || ''; b = b || '';
        if (!a && !b) return 0;
        if (!a) return 1;
        if (!b) return -1;
        var va = /^V\d+$/i.test(a), vb = /^V\d+$/i.test(b);
        if (va !== vb) return va ? -1 : 1;
        if (va) return parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10);
        return a < b ? -1 : (a > b ? 1 : 0);
    }

    async function load() {
        var sheet = document.getElementById('sheet');
        if (!PO_IDS.length) {
            sheet.innerHTML = '<div class="empty">没有选中采购单</div>';
            return;
        }
        try {
            var tasks = [getJSON('/api/skus')].concat(PO_IDS.map(function (id) {
                return getJSON('/api/purchase-orders/' + id);
            }));
            var res = await Promise.all(tasks);

            (res[0].data || []).forEach(function (s) { SKUS[s.id] = s; });

            var pos = [];
            for (var i = 1; i < res.length; i++) {
                if (res[i] && res[i].success && res[i].data) pos.push(res[i].data);
            }
            if (!pos.length) throw new Error('选中的采购单都读取失败');
            render(pos);
        } catch (err) {
            sheet.innerHTML = '<div class="empty">' + esc(err.message || '读取失败') + '</div>';
        }
    }

    // 合并清单不再按单展示：所有单据的明细直接汇进两张合并表，
    // 同一物品跨单合并，只用「单据数」说明它来自几张单。
    function productInfo(it, currency) {
        var sku = it.item_id ? SKUS[it.item_id] : null;
        var name = (sku && sku.product_name_zh) || it.item_name || it.item_code || '';
        var model = (sku && sku.model) || it.spec || '';
        return {
            sku: it.item_id || 0,
            name: name,
            model: model,
            color: (sku && sku.color) || stripModel(name, model),
            series: (sku && sku.series) ? String(sku.series).trim() : '',
            currency: currency,
            qty: Number(it.quantity || 0),
            price: Number(it.unit_price || 0),
            amount: Number(it.amount || 0)
        };
    }

    function materialInfo(it, currency) {
        return {
            name: it.item_name || it.short_name || it.item_code || '',
            spec: it.spec || '',
            currency: currency,
            qty: Number(it.quantity || 0),
            price: Number(it.unit_price || 0),
            amount: Number(it.amount || 0)
        };
    }

    // 按「物品 + 币种」聚合：不同币种的金额不能相加，宁可分成两行。
    function collectRows(kind, keyOf, fields) {
        var groups = {}, order = [];

        ALL_POS.forEach(function (po) {
            var currency = po.currency || 'CNY';
            (po.items || []).forEach(function (it) {
                var isMaterial = it.item_type === 'material';
                if ((kind === 'material') !== isMaterial) return;

                var row = kind === 'material' ? materialInfo(it, currency) : productInfo(it, currency);
                var key = keyOf(row);
                var g = groups[key];
                if (!g) {
                    g = { key: key, qty: 0, amount: 0, pos: {}, prices: {} };
                    fields.forEach(function (f) { g[f] = row[f] === undefined ? '' : row[f]; });
                    g.currency = currency;
                    groups[key] = g;
                    order.push(key);
                }
                g.qty += row.qty;
                g.amount += row.amount;
                if (row.price > 0) g.prices[row.price] = true;
                if (po.po_number) g.pos[po.po_number] = true;
            });
        });

        return order.map(function (k) { return groups[k]; });
    }

    function listHead(title, tableId) {
        return '<div class="list-head"><h3>' + esc(title) + '</h3>'
            + '<div class="list-tools"><span class="hint" data-role="hidden-hint"></span>'
            + '<button class="btn btn-mini hide-picked-btn" type="button" data-table="' + tableId + '">隐藏勾选</button>'
            + '<button class="btn btn-mini show-all-btn" type="button" data-table="' + tableId + '">显示全部</button>'
            + '</div></div>';
    }

    function render(pos) {
        ALL_POS = pos;

        var numbers = pos.map(function (po) { return po.po_number; }).filter(function (v) { return !!v; });
        var currencies = [], suppliers = [];
        pos.forEach(function (po) {
            var c = po.currency || 'CNY';
            if (currencies.indexOf(c) < 0) currencies.push(c);
            var sup = po.supplier_name || '';
            if (sup && suppliers.indexOf(sup) < 0) suppliers.push(sup);
        });
        MULTI_CURRENCY = currencies.length > 1;

        document.getElementById('sheet').innerHTML = ''
            + '<h1>采购合并单<span class="no">' + numbers.length + ' 张</span>'
            + ' <span class="badge">' + esc(currencies.join(' / ')) + '</span></h1>'
            + '<div class="meta">'
            + '<span>单号：<b>' + esc(numbers.join(' / ')) + '</b></span>'
            + '<span>供应商：<b>' + esc(suppliers.join(' / ') || '—') + '</b></span>'
            + '<span>制表时间：' + esc(new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-')) + '</span>'
            + '</div>'
            + '<div class="summary" id="summaryBar"></div>'
            + '<section class="po-block">'
            + listHead('产品（按 SKU 合并）', 'mergeProduct')
            + '<table id="mergeProduct">'
            + '<thead><tr>'
            + '<th class="ctr pick-col"><input type="checkbox" class="pick-all" title="全选 / 全不选"></th>'
            + '<th class="ctr" style="width:44px">序号</th>'
            + '<th>产品中文名</th><th style="width:110px">型号</th><th style="width:100px">颜色</th>'
            + '<th class="num" style="width:96px">数量合计</th>'
            + '<th class="num" style="width:80px">单价</th>'
            + '<th class="num" style="width:110px">金额合计</th>'
            + '<th class="num" style="width:90px">单据数</th>'
            + '</tr></thead><tbody></tbody>'
            + '<tfoot><tr class="total"><td class="pick-col"></td><td colspan="4">合计</td>'
            + '<td class="num" data-role="qty">0</td><td></td>'
            + '<td class="num" data-role="amount">0.00</td><td></td></tr></tfoot>'
            + '</table>'
            + listHead('材料（按规格合并）', 'mergeMaterial')
            + '<table id="mergeMaterial">'
            + '<thead><tr>'
            + '<th class="ctr pick-col"><input type="checkbox" class="pick-all" title="全选 / 全不选"></th>'
            + '<th class="ctr" style="width:44px">序号</th>'
            + '<th>材料</th><th>规格</th>'
            + '<th class="num" style="width:96px">用量合计</th>'
            + '<th class="num" style="width:80px">单价</th>'
            + '<th class="num" style="width:110px">金额合计</th>'
            + '<th class="num" style="width:90px">单据数</th>'
            + '</tr></thead><tbody></tbody>'
            + '<tfoot><tr class="total"><td class="pick-col"></td><td colspan="3">合计</td>'
            + '<td class="num" data-role="qty">0</td><td></td>'
            + '<td class="num" data-role="amount">0.00</td><td></td></tr></tfoot>'
            + '</table>'
            + '</section>'
            + '<div class="note">合并口径：同一 SKU（产品）/ 同一规格（材料）跨单合并，'
            + '单价不一致时显示区间；合计只统计当前可见行。</div>'
            + '<div class="foot"><span>OrderAI · 采购合并单</span><span>' + esc(numbers.join(' / ')) + '</span></div>';

        refresh();
    }

    // 两张表各自重算：序号按可见行重排、合计只算可见行（隐藏的行不该出现在给厂家的数量里），
    // 顶部汇总直接取两张表的可见合计，保证上面的数字与清单合计永远一致。
    function refresh() {
        var merged = renderMergedSummary();

        // 运费按单据累加，与清单里隐藏了哪些行无关。
        var freight = 0;
        ALL_POS.forEach(function (po) { freight += Number(po.freight_amount || 0); });

        renderSummaryBar(merged.productQty, merged.productAmount, merged.materialQty, merged.materialAmount, freight, MULTI_CURRENCY);
    }

    // 合并行的单价：各来源行价格一致时直接显示；不一致时显示区间，
    // 不用加权均价掩盖差价（同一规格不同厂家报价本来就该一眼看出来）。
    function priceCell(g) {
        var list = Object.keys(g.prices || {}).map(Number)
            .filter(function (v) { return v > 0; })
            .sort(function (a, b) { return a - b; });

        var text = '—';
        var tip = '';
        if (list.length === 1) {
            text = money(list[0]);
        } else if (list.length > 1) {
            text = money(list[0]) + '~' + money(list[list.length - 1]);
            tip = '合并了 ' + list.length + ' 种单价';
        }
        // 多币种时单看数字分不清币种，补一个小的币种后缀；单币种保持干净。
        var ccy = (MULTI_CURRENCY && g.currency)
            ? ' <span class="ccy">' + esc(g.currency) + '</span>'
            : '';
        return '<td class="num" title="' + esc(tip) + '">' + text + ccy + '</td>';
    }

    // 系列小计行：与产品表 9 列对齐（勾选 + 序号 + 名称/型号/颜色 + 数量 + 单价 + 金额 + 单据数）。
    function mergedSubtotalRow(label, stat, cellsWidth, hidden) {
        return '<tr class="subtotal' + (hidden ? ' row-hidden' : '') + '" data-sub="' + esc(label) + '">'
            + '<td class="pick-col"></td>'
            + '<td colspan="' + (cellsWidth + 1) + '">'
            + esc(label + ' 小计（' + stat.count + ' 项）') + '</td>'
            + '<td class="num">' + qty(stat.qty) + '</td>'
            + '<td></td>'
            + '<td class="num">' + money(stat.amount) + '</td>'
            + '<td></td>'
            + '</tr>';
    }

    // 合并清单中的一张表：按可见行重排序号、只累加可见行，并恢复上次的显隐与勾选。
    // groupOf 传入时按组插小计行（产品按系列/版本），组内全隐藏则小计一起隐藏。
    // 返回本表可见合计，供顶部汇总使用。
    function fillTable(tableId, list, cells, qtyRole, amountRole, groupOf) {
        var table = document.getElementById(tableId);
        if (!table) return { qty: 0, amount: 0 };

        var tbody = table.querySelector('tbody');
        var hiddenBag = hiddenMerge[tableId] || (hiddenMerge[tableId] = {});
        var pickBag = pickedMerge[tableId] || (pickedMerge[tableId] = {});
        var qtySum = 0, amountSum = 0, shown = 0, picked = 0;

        // 组数 > 1 才插小计：只有一个系列时小计和表尾合计重复。
        var groups = {};
        if (groupOf) {
            list.forEach(function (g) { groups[groupOf(g).key] = true; });
        }
        var showSub = !!groupOf && Object.keys(groups).length > 1;

        // 每组可见合计先算好，插到组尾那一行后面。
        var groupStat = {};
        if (showSub) {
            list.forEach(function (g) {
                if (hiddenBag[g.key]) return;
                var grp = groupOf(g);
                var st = groupStat[grp.key] || (groupStat[grp.key] = { count: 0, qty: 0, amount: 0 });
                st.count += 1;
                st.qty += g.qty;
                st.amount += g.amount;
            });
        }

        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="' + (cells.length + 6) + '" class="empty">暂无数据</td></tr>';
        } else {
            var html = '';
            list.forEach(function (g, idx) {
                var hidden = !!hiddenBag[g.key];
                var isPicked = !hidden && !!pickBag[g.key];
                if (hidden) {
                    delete pickBag[g.key];
                } else {
                    shown += 1;
                    qtySum += g.qty;
                    amountSum += g.amount;
                    if (isPicked) picked += 1;
                }
                var posCount = Object.keys(g.pos).length;
                html += '<tr data-key="' + esc(g.key) + '" data-qty="' + g.qty + '" data-amount="' + g.amount + '"'
                    + (hidden ? ' class="row-hidden"' : '') + '>'
                    + '<td class="ctr pick-col"><input type="checkbox" class="row-pick"'
                    + (isPicked ? ' checked' : '') + '></td>'
                    + '<td class="ctr row-no">' + (hidden ? '' : shown) + '</td>'
                    + cells.map(function (c) { return c(g); }).join('')
                    + '<td class="num">' + qty(g.qty) + '</td>'
                    + priceCell(g)
                    + '<td class="num">' + money(g.amount) + '</td>'
                    + '<td class="num">' + posCount + '</td>'
                    + '</tr>';

                if (showSub) {
                    var grp = groupOf(g);
                    var next = list[idx + 1];
                    if (!next || groupOf(next).key !== grp.key) {
                        var st = groupStat[grp.key] || { count: 0, qty: 0, amount: 0 };
                        html += mergedSubtotalRow(grp.label, st, cells.length, st.count === 0);
                    }
                }
            });
            // 全部行都被隐藏时给个占位提示，否则表格看起来像坏了。
            if (shown === 0) {
                html += '<tr><td colspan="' + (cells.length + 6) + '" class="empty">'
                    + '全部行已隐藏，点「显示全部」恢复</td></tr>';
            }
            tbody.innerHTML = html;
        }

        var qtyEl = table.querySelector('[data-role="' + qtyRole + '"]');
        if (qtyEl) qtyEl.textContent = qty(qtySum);
        var amountEl = table.querySelector('[data-role="' + amountRole + '"]');
        if (amountEl) amountEl.textContent = money(amountSum);

        var head = table.previousElementSibling;
        var hintEl = head ? head.querySelector('[data-role="hidden-hint"]') : null;
        var hiddenCount = list.length - shown;
        if (hintEl) hintEl.textContent = hiddenCount > 0 ? ('已隐藏 ' + hiddenCount + ' 行') : '';

        var allBox = table.querySelector('.pick-all');
        if (allBox) {
            allBox.checked = shown > 0 && picked === shown;
            allBox.indeterminate = picked > 0 && picked < shown;
            allBox.disabled = shown === 0;
        }
        var hideBtn = head ? head.querySelector('.hide-picked-btn') : null;
        if (hideBtn) hideBtn.disabled = picked === 0;
        var showBtn = head ? head.querySelector('.show-all-btn') : null;
        if (showBtn) showBtn.disabled = hiddenCount === 0;

        return { qty: qtySum, amount: amountSum };
    }

    // 合并表每次都会整块重建，勾选状态从 DOM 回写到 pickedMerge。
    function syncMergePicked(table) {
        var bag = pickedMerge[table.id] || (pickedMerge[table.id] = {});
        Array.prototype.slice.call(table.querySelectorAll('tbody tr[data-key]')).forEach(function (tr) {
            var key = tr.getAttribute('data-key');
            var box = tr.querySelector('.row-pick');
            if (!key) return;
            if (tr.classList.contains('row-hidden') || !box || !box.checked) delete bag[key];
            else bag[key] = true;
        });
    }

    // 小计按系列/版本分组；多币种时同系列不同币种分开算，不跨币种相加。
    // 系列带中文名时拼成「V1-西瓜球」，与截图页口径一致。
    function productGroup(g) {
        var label = g.series || '未分系列';
        if (MULTI_CURRENCY && g.currency) label += '（' + g.currency + '）';
        if (g.seriesCN) label += '-' + g.seriesCN;
        return { key: label, label: label };
    }

    function renderMergedSummary() {
        var products = collectRows('product', function (row) {
            return (row.sku || 0) + '|' + (row.name || '') + '|' + (row.currency || '');
        }, ['name', 'model', 'color', 'series', 'currency']);

        var materials = collectRows('material', function (row) {
            return (row.name || '') + '|' + (row.spec || '') + '|' + (row.currency || '');
        }, ['name', 'spec', 'currency']);

        // 同系列的行必须连续，小计才好插在组尾；组内保持汇总时的原顺序。
        products.sort(function (a, b) {
            var c = seriesCompare(a.series, b.series);
            if (c !== 0) return c;
            if (!MULTI_CURRENCY) return 0;
            var ca = a.currency || '', cb = b.currency || '';
            return ca < cb ? -1 : (ca > cb ? 1 : 0);
        });

        // 每组的中文名（V1 + 西瓜球 → V1-西瓜球）：同组产品中文名的公共前缀。
        var bySeries = {};
        products.forEach(function (g) {
            var k = (g.series || '未分系列') + (MULTI_CURRENCY ? '|' + (g.currency || '') : '');
            (bySeries[k] || (bySeries[k] = [])).push(g);
        });
        Object.keys(bySeries).forEach(function (k) {
            var cn = seriesCN(bySeries[k].map(function (g) { return g.name; }));
            bySeries[k].forEach(function (g) { g.seriesCN = cn; });
        });

        var p = fillTable('mergeProduct', products, [
            function (g) { return '<td class="cell-name">' + esc(g.name) + '</td>'; },
            function (g) { return '<td>' + esc(g.model) + '</td>'; },
            function (g) { return '<td>' + esc(g.color) + '</td>'; }
        ], 'qty', 'amount', productGroup);

        var m = fillTable('mergeMaterial', materials, [
            function (g) { return '<td class="cell-name">' + esc(g.name) + '</td>'; },
            function (g) { return '<td>' + esc(g.spec) + '</td>'; }
        ], 'qty', 'amount');

        return {
            productQty: p.qty, productAmount: p.amount,
            materialQty: m.qty, materialAmount: m.amount
        };
    }

    function renderSummaryBar(productQty, productAmount, materialQty, materialAmount, freight, multiCurrency) {
        var bar = document.getElementById('summaryBar');
        if (!bar) return;
        var cells = [
            ['产品金额', money(productAmount)],
            ['材料金额', money(materialAmount)],
            ['运费', money(freight)],
            ['合计', money(productAmount + materialAmount + freight)]
        ];
        bar.innerHTML = cells.map(function (kv, i) {
            var tip = (i === 3 && multiCurrency)
                ? '<span class="unit">多币种简单相加，仅供估算</span>'
                : '';
            return '<div class="cell"><div class="k">' + esc(kv[0]) + '</div>'
                + '<div class="v">' + esc(kv[1]) + tip + '</div></div>';
        }).join('');
    }

    // 事件委托挂在 #sheet 上，重绘后无需重新绑定。
    document.getElementById('sheet').addEventListener('change', function (e) {
        var box = e.target;
        if (!box.classList) return;
        var table = box.closest ? box.closest('table') : null;

        if (box.classList.contains('pick-all')) {
            if (!table) return;
            Array.prototype.slice.call(table.querySelectorAll('tbody tr[data-qty]')).forEach(function (tr) {
                if (tr.classList.contains('row-hidden')) return;
                var b = tr.querySelector('.row-pick');
                if (b) b.checked = box.checked;
            });
        }
        // 合并清单会整块重绘，勾选状态先记到 bag 里。
        if (table && table.id && table.id.indexOf('merge') === 0) syncMergePicked(table);
        refresh();
    });

    document.getElementById('sheet').addEventListener('click', function (e) {
        if (!e.target.closest) return;

        var hideBtn = e.target.closest('.hide-picked-btn');
        if (hideBtn) {
            var t1 = document.getElementById(hideBtn.getAttribute('data-table'));
            if (t1) {
                var isMerge = t1.id && t1.id.indexOf('merge') === 0;
                var hiddenBag = isMerge ? (hiddenMerge[t1.id] || (hiddenMerge[t1.id] = {})) : null;
                var pickBag = isMerge ? (pickedMerge[t1.id] || (pickedMerge[t1.id] = {})) : null;

                Array.prototype.slice.call(t1.querySelectorAll('tbody tr[data-qty]')).forEach(function (tr) {
                    var box = tr.querySelector('.row-pick');
                    if (tr.classList.contains('row-hidden') || !box || !box.checked) return;
                    if (isMerge) {
                        var key = tr.getAttribute('data-key');
                        if (key) {
                            hiddenBag[key] = true;
                            if (pickBag) delete pickBag[key];
                        }
                    }
                    tr.classList.add('row-hidden');
                    box.checked = false;
                });
            }
            refresh();
            return;
        }

        var showBtn = e.target.closest('.show-all-btn');
        if (showBtn) {
            var t2 = document.getElementById(showBtn.getAttribute('data-table'));
            if (t2) {
                if (t2.id && t2.id.indexOf('merge') === 0) {
                    hiddenMerge[t2.id] = {};
                    pickedMerge[t2.id] = {};
                }
                Array.prototype.slice.call(t2.querySelectorAll('tbody tr[data-qty]')).forEach(function (tr) {
                    tr.classList.remove('row-hidden');
                    var box = tr.querySelector('.row-pick');
                    if (box) box.checked = false;
                });
            }
            refresh();
        }
    });

    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
    document.getElementById('backBtn').addEventListener('click', function () {
        if (window.history.length > 1) { window.history.back(); }
        else { window.location.href = '/purchase-orders'; }
    });

    // 干净视图：隐藏勾选框列与行内按钮，直接屏幕截图也能发给厂家。
    (function () {
        var btn = document.getElementById('cleanViewBtn');
        if (!btn) return;
        btn.addEventListener('click', function () {
            var clean = document.body.classList.toggle('clean');
            btn.textContent = clean ? '显示勾选框' : '隐藏勾选框';
        });
    })();

    load();
</script>
</body>
</html>
