                OrderAI 系统运行正常
            </div>

                AI订单识别、订单管理和数据库服务均已准备就绪。

            </div>

        </div>

    </div>

</div>


<script>

$(document).ready(function () {

    loadDashboard();

});


function loadDashboard() {

    $.ajax({

        url: "/api/orders",

        type: "GET",

        success: function (res) {

            if (!res.success) {
                return;
            }

            const orders = res.data || [];


            /*
             * 订单总数
             */

            $("#totalOrders")
                .text(orders.length);


            /*
             * 今日订单
             */

            const today =
                new Date()
                    .toISOString()
                    .substring(0, 10);


            const todayOrders =
                orders.filter(function (order) {

                    return (
                        order.created_at &&
                        order.created_at.substring(0, 10)
                            === today
                    );

                });


            $("#todayOrders")
                .text(todayOrders.length);


            /*
             * 已确认
             */

            const confirmed =
                orders.filter(function (order) {

                    return order.status === "confirmed";

                });


            $("#confirmedOrders")
                .text(confirmed.length);


            /*
             * 最近订单
             */

            renderRecentOrders(orders);

        }

    });

}


function renderRecentOrders(orders) {

    const tbody =
        $("#recentOrders");


    if (!orders.length) {

        tbody.html(`
            <tr>
                <td
                    colspan="5"
                    class="text-center text-muted py-4">

                    暂无订单

                </td>
            </tr>
        `);

        return;
    }


    const recent =
        orders.slice(0, 8);


    tbody.empty();


    recent.forEach(function (order) {

        tbody.append(`

            <tr>

                <td>

                    <a
                        href="/orders/${order.id}"
                        class="order-link">

                        ${escapeHtml(
                            order.order_number
                        )}

                    </a>

                </td>

                <td>
                    ${escapeHtml(
                        order.customer || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        order.country || "-"
                    )}
                </td>

                <td>

                    <span class="badge bg-primary">
                        已确认
                    </span>

                </td>

                <td>
                    ${formatDashboardDate(
                        order.created_at
                    )}
                </td>

            </tr>

        `);

    });

}


function formatDashboardDate(value) {

    if (!value) {
        return "-";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return value;
    }

    return (
        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0") +
        " " +
        String(date.getHours()).padStart(2, "0") +
        ":" +
        String(date.getMinutes()).padStart(2, "0")
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

{{end}}
