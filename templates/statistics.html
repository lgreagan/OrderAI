{{define "content"}}
<div class="container-fluid px-0">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h4 class="mb-1">数据统计</h4>
            <div class="text-secondary small">订单、采购、生产、发货、PI 收款与库存预警总览</div>
        </div>
        <button class="btn btn-outline-secondary" id="refreshBtn">刷新</button>
    </div>

    <div id="messageArea"></div>

    <div class="row g-3 mb-3" id="cardRow"></div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="mb-3">订单状态分布</h6>
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light"><tr><th>状态</th><th class="text-end">数量</th></tr></thead>
                        <tbody id="orderStatusBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="mb-3">生产状态分布</h6>
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light"><tr><th>状态</th><th class="text-end">数量</th></tr></thead>
                        <tbody id="prodStatusBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="mb-3">负库存 <span class="badge text-bg-danger" id="negBadge">0</span></h6>
                    <div class="table-responsive" style="max-height:260px;overflow:auto">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>类型</th><th>编码</th><th>名称</th><th class="text-end">结存</th></tr>
                            </thead>
                            <tbody id="negBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h6 class="mb-3">低库存 <span class="badge text-bg-warning" id="lowBadge">0</span>
                        <span class="text-secondary small" id="lowThreshold"></span>
                    </h6>
                    <div class="table-responsive" style="max-height:260px;overflow:auto">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>类型</th><th>编码</th><th>名称</th><th class="text-end">结存</th></tr>
                            </thead>
                            <tbody id="lowBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function () {
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        const money = v => Number(v || 0).toFixed(2);
        const num = v => Number(v || 0).toFixed(3).replace(/\.?0+$/, '');

        const orderStatusLabel = {
            confirmed: '已确认', purchased: '已采购', produced: '已生产',
            shipped: '已发货', paid: '已收款', completed: '完结'
        };
        const prodStatusLabel = {
            draft: '草稿', producing: '生产中', completed: '已完工', cancelled: '已取消'
        };

        function card(title, value, sub, color) {
            return `
                <div class="col-6 col-lg-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <div class="text-secondary small">${esc(title)}</div>
                            <div class="fs-4 fw-bold ${color || 'text-dark'}">${esc(value)}</div>
                            <div class="text-secondary small">${esc(sub || '')}</div>
                        </div>
                    </div>
                </div>`;
        }

        function statusRows(list, labels) {
            if (!list || !list.length) {
                return '<tr><td colspan="2" class="text-center text-secondary py-3">暂无数据</td></tr>';
            }
            return list.map(s => `
                <tr>
                    <td>${esc(labels[s.label] || s.label)}</td>
                    <td class="text-end fw-semibold">${s.count}</td>
                </tr>`).join('');
        }

        function stockRows(list) {
            if (!list || !list.length) {
                return '<tr><td colspan="4" class="text-center text-secondary py-3">无</td></tr>';
            }
            return list.map(a => `
                <tr>
                    <td>${a.item_type === 'material' ? '材料' : '产品'}</td>
                    <td class="fw-semibold">${esc(a.item_code)}</td>
                    <td>${esc(a.item_name)}</td>
                    <td class="text-end ${a.stock < 0 ? 'text-danger fw-semibold' : ''}">${num(a.stock)}</td>
                </tr>`).join('');
        }

        async function load() {
            try {
                const result = await $.getJSON('/api/statistics/overview');
                if (!result.success) throw new Error(result.message || '读取失败');
                const d = result.data;

                $('#cardRow').html([
                    card('订单总数', d.order_total, '客户订单'),
                    card('采购单', d.purchase_count, `金额 ${money(d.purchase_amount)}`),
                    card('生产单', d.production_count, '生产任务'),
                    card('发货单', d.shipment_count, `运费 ${money(d.freight_total)} + 保险 ${money(d.insurance_total)}`),
                    card('PI 张数', d.pi_count, `累计未收 ${money(d.pi_unpaid)}`, 'text-danger'),
                    card('PI 已收', money(d.pi_paid), `收款 ${d.payment_count} 笔 / ${money(d.payment_amount)}`, 'text-success'),
                    card('产品 SKU', d.sku_count, '成品/单品'),
                    card('材料', d.material_count, '包材/原材料')
                ].join(''));

                $('#orderStatusBody').html(statusRows(d.order_by_status, orderStatusLabel));
                $('#prodStatusBody').html(statusRows(d.production_by_status, prodStatusLabel));

                $('#negBadge').text((d.negative_stock || []).length);
                $('#negBody').html(stockRows(d.negative_stock));

                $('#lowBadge').text((d.low_stock || []).length);
                $('#lowThreshold').text(d.low_stock_threshold > 0
                    ? `(阈值 <= ${num(d.low_stock_threshold)})`
                    : '(未设置阈值，可在系统设置中配置)');
                $('#lowBody').html(stockRows(d.low_stock));
            } catch (err) {
                $('#messageArea').html(
                    `<div class="alert alert-danger">${esc(err.responseJSON?.message || err.message || '读取统计失败')}</div>`
                );
            }
        }

        $('#refreshBtn').on('click', load);
        load();
    });
</script>
{{end}}
